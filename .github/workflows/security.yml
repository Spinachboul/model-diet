name: Dependency security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Audit core runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency auditor
        run: python -m pip install "pip-audit>=2.10.1,<3"
      - name: Audit production dependencies and their dependency tree
        run: pip-audit . --strict --progress-spinner off

  development:
    name: Audit development, demo, and documentation dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency auditor and project extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.10.1,<3"
          python -m pip install -e ".[test,demo,dev]" -r requirements-docs.txt
      - name: Audit installed development and demo dependency tree
        run: pip-audit --local --skip-editable --progress-spinner off
