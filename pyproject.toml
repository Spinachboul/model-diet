[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeldiet"
version = "0.1.0"
description = "Profile inference performance and resource usage of trained models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
demo = ["scikit-learn>=1.3", "xgboost>=2.0"]
test = ["pytest>=8", "pandas>=2", "build>=1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
